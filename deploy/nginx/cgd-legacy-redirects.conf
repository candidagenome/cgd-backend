# Legacy CGI -> SPA 301 redirect rules for the CGD frontend site.
#
# Place these inside the main server { } block of:
#   /etc/nginx/sites-available/cgd   (on cgd-prod, behind the AWS ALB)
# immediately BEFORE the SPA fallback `location / { ... }`, otherwise the
# catch-all would serve index.html (200) for old CGI URLs and the SPA would
# client-side 404. This file mirrors the rules deployed there.
#
# Applied in three phases (all validated against the live React-Router route
# table and /api resolvers):
#   phase-1  plain locus/chromosome/reference/search CGI URLs
#   phase-2  param-mapped scripts -> /locus/<x>?tab=..., /protein/<x>/..., etc.
#            (/locus/<name> resolves dbid | systematic | standard names alike)
#   phase-3  low-traffic tail + SECURITY: redirect.pl was an OPEN REDIRECT
#            (?url=<anywhere>, abused for SEO/spam laundering) -> now 301 /,
#            the url= parameter is deliberately NOT honored.
#
# `absolute_redirect off;` in every block: the ALB terminates TLS and proxies
# to nginx on :80, so $scheme is "http" here; a relative Location keeps the
# browser on https.

    # ── Legacy CGI redirects (retired candidagenome.org CGI URLs) ────────────
    # Old query-string CGI URLs → new SPA paths, 301 (permanent).
    # The ALB terminates TLS and forwards to us on :80, so $scheme is "http"
    # here; absolute_redirect off emits a relative Location so the browser
    # stays on https.

    # locus.pl?locus=<NAME>                  → /locus/<NAME>
    location = /cgi-bin/locus.pl {
        absolute_redirect off;
        if ($arg_locus) { return 301 /locus/$arg_locus; }
        return 301 /;
    }

    # homologPage.pl?locus=<NAME>            → /locus/<NAME>?tab=homology
    location = /cgi-bin/homologPage.pl {
        absolute_redirect off;
        if ($arg_locus) { return 301 /locus/$arg_locus?tab=homology; }
        return 301 /;
    }

    # locusHistory.pl?locus=<NAME>           → /locus/<NAME>?tab=history
    location = /cgi-bin/locusHistory.pl {
        absolute_redirect off;
        if ($arg_locus) { return 301 /locus/$arg_locus?tab=history; }
        return 301 /;
    }

    # chromosome.pl?chr=<NAME>               → /chromosome/<NAME>
    location = /cgi-bin/chromosome.pl {
        absolute_redirect off;
        if ($arg_chr) { return 301 /chromosome/$arg_chr; }
        return 301 /chromosome;
    }

    # genomeSnapshot.pl?organism=<ORG>       → /genome-snapshot/<ORG>
    location = /cgi-bin/genomeSnapshot.pl {
        absolute_redirect off;
        if ($arg_organism) { return 301 /genome-snapshot/$arg_organism; }
        return 301 /genome-snapshot/C_albicans_SC5314;
    }

    # genomeVersionHistory.pl                → /genome-version-history
    location = /cgi-bin/genomeVersionHistory.pl {
        absolute_redirect off;
        return 301 /genome-version-history;
    }

    # reference/reference.pl?dbid=<CGDID>|pubmed=<PMID> → /reference/<ID>
    # (the SPA reference page accepts either a CGDID or a PMID)
    location = /cgi-bin/reference/reference.pl {
        absolute_redirect off;
        if ($arg_dbid)   { return 301 /reference/$arg_dbid; }
        if ($arg_pubmed) { return 301 /reference/$arg_pubmed; }
        return 301 /;
    }

    # search.pl?class=&item=                 → /search (params don't map cleanly)
    location = /cgi-bin/search.pl {
        absolute_redirect off;
        return 301 /search;
    }

    # launchGenomeView.pl?...                → /jbrowse2/
    location = /cgi-bin/launchGenomeView.pl {
        absolute_redirect off;
        return 301 /jbrowse2/;
    }

    # ── Phase-2 legacy CGI param-mapped redirects (validated 2026-06-18) ──
    # /locus/<name> resolves dbid | systematic | standard names alike.

    # gx_expression.pl?gene=<NAME> → expression tab; ?pubNo=<N> → reference page
    location = /cgi-bin/expression/gx_expression.pl {
        absolute_redirect off;
        if ($arg_gene)  { return 301 /locus/$arg_gene?tab=expression; }
        if ($arg_pubNo) { return 301 /reference/$arg_pubNo; }
        return 301 /;
    }
    # litGuide.pl?locus|dbid=<X> → locus literature tab
    location = /cgi-bin/reference/litGuide.pl {
        absolute_redirect off;
        if ($arg_locus) { return 301 /locus/$arg_locus?tab=literature; }
        if ($arg_dbid)  { return 301 /locus/$arg_dbid?tab=literature; }
        return 301 /;
    }
    # proteinPage.pl?locus|dbid=<X> → locus protein tab
    location = /cgi-bin/protein/proteinPage.pl {
        absolute_redirect off;
        if ($arg_locus) { return 301 /locus/$arg_locus?tab=protein; }
        if ($arg_dbid)  { return 301 /locus/$arg_dbid?tab=protein; }
        return 301 /;
    }
    # domainPage.pl?locus|dbid=<X> → protein domains page
    location = /cgi-bin/protein/domainPage.pl {
        absolute_redirect off;
        if ($arg_locus) { return 301 /protein/$arg_locus/domains; }
        if ($arg_dbid)  { return 301 /protein/$arg_dbid/domains; }
        return 301 /;
    }
    # proteinProperty.pl?locus|dbid=<X> → protein properties page
    location = /cgi-bin/protein/proteinProperty.pl {
        absolute_redirect off;
        if ($arg_locus) { return 301 /protein/$arg_locus/properties; }
        if ($arg_dbid)  { return 301 /protein/$arg_dbid/properties; }
        return 301 /;
    }
    # phenotype.pl?dbid|locus=<X> → locus phenotype tab; ?observable=<T> → phenotype search
    location = /cgi-bin/phenotype/phenotype.pl {
        absolute_redirect off;
        if ($arg_dbid)       { return 301 /locus/$arg_dbid?tab=phenotype; }
        if ($arg_locus)      { return 301 /locus/$arg_locus?tab=phenotype; }
        if ($arg_observable) { return 301 /phenotype/search?observable=$arg_observable; }
        return 301 /phenotype/search;
    }
    # go.pl?goid=<N> → GO term page
    location = /cgi-bin/GO/go.pl {
        absolute_redirect off;
        if ($arg_goid) { return 301 /go/$arg_goid; }
        return 301 /;
    }
    # goAnnotation.pl?dbid|locus=<X> → locus GO tab
    location = /cgi-bin/GO/goAnnotation.pl {
        absolute_redirect off;
        if ($arg_dbid)  { return 301 /locus/$arg_dbid?tab=go; }
        if ($arg_locus) { return 301 /locus/$arg_locus?tab=go; }
        return 301 /;
    }

    # ── Phase-3 legacy CGI redirects (low-traffic tail; validated 2026-06-18) ──

    # redirect.pl was an OPEN REDIRECT (?url=<anywhere>) abused for SEO/spam
    # laundering. Do NOT honor ?url=; send everything to home.
    location = /cgi-bin/redirect.pl {
        absolute_redirect off;
        return 301 /;
    }

    # BLAST family → /blast (tool has no gene-prefill param)
    location = /cgi-bin/compute/blast_clade.pl {
        absolute_redirect off;
        return 301 /blast;
    }
    location = /cgi-bin/compute/blast-clade.pl {
        absolute_redirect off;
        return 301 /blast;
    }
    location = /cgi-bin/compute/blast-sgd.pl {
        absolute_redirect off;
        return 301 /blast;
    }
    location = /cgi-bin/BLAST/blast.pl {
        absolute_redirect off;
        return 301 /blast;
    }

    # chromosomeHistory.pl?chr|dbid=<X> → chromosome page
    location = /cgi-bin/chromosomeHistory.pl {
        absolute_redirect off;
        if ($arg_chr)  { return 301 /chromosome/$arg_chr; }
        if ($arg_dbid) { return 301 /chromosome/$arg_dbid; }
        return 301 /genome-version-history;
    }

    # downloadPcl.pl?pubNo=<N> → reference page (PCL file dl has no SPA equivalent)
    location = /cgi-bin/expression/downloadPcl.pl {
        absolute_redirect off;
        if ($arg_pubNo) { return 301 /reference/$arg_pubNo; }
        return 301 /download;
    }

    # refsWithData.pl → genome-wide analysis landing
    location = /cgi-bin/reference/refsWithData.pl {
        absolute_redirect off;
        return 301 /genome-wide-analysis;
    }

    # nicezyme.pl (restriction analysis) → restriction mapper
    location = /cgi-bin/nicezyme.pl {
        absolute_redirect off;
        return 301 /restriction-mapper;
    }

    # getAlleleSeq.pl?locus=<X> → locus sequence tab
    location = /cgi-bin/getAlleleSeq.pl {
        absolute_redirect off;
        if ($arg_locus) { return 301 /locus/$arg_locus?tab=sequence; }
        if ($arg_dbid)  { return 301 /locus/$arg_dbid?tab=sequence; }
        return 301 /seq-tools;
    }

    # download.pl → download datasets page
    location = /cgi-bin/download.pl {
        absolute_redirect off;
        return 301 /download;
    }

    # geneinfo.pl?locus|dbid=<X> → locus page
    location = /cgi-bin/reference/geneinfo.pl {
        absolute_redirect off;
        if ($arg_locus) { return 301 /locus/$arg_locus; }
        if ($arg_dbid)  { return 301 /locus/$arg_dbid; }
        return 301 /;
    }

    # yeastLabs.pl → labs directory
    location = /cgi-bin/colleague/yeastLabs.pl {
        absolute_redirect off;
        return 301 /labs;
    }

    # feature_page.pl?dbid|locus=<X> → locus page
    location = /cgi-bin/feature_page.pl {
        absolute_redirect off;
        if ($arg_dbid)  { return 301 /locus/$arg_dbid; }
        if ($arg_locus) { return 301 /locus/$arg_locus; }
        return 301 /;
    }

    # goEvidence.pl?goid=<N> → GO term page, else GO evidence-code page
    location = /cgi-bin/GO/goEvidence.pl {
        absolute_redirect off;
        if ($arg_goid) { return 301 /go/$arg_goid; }
        return 301 /go/evidence;
    }

    # search/search.pl?query=<Q> → search results
    location = /cgi-bin/search/search.pl {
        absolute_redirect off;
        if ($arg_query) { return 301 /search/results?query=$arg_query; }
        return 301 /search;
    }

    # protein_fasta_seq.pl → sequence tools
    location = /cgi-bin/protein_fasta_seq.pl {
        absolute_redirect off;
        return 301 /seq-tools;
    }

    # main.pl → home
    location = /cgi-bin/main.pl {
        absolute_redirect off;
        return 301 /;
    }

    # expressionConnection.pl → home (no SPA equivalent)
    location = /cgi-bin/expression/expressionConnection.pl {
        absolute_redirect off;
        return 301 /;
    }

    # ── Phase-4 legacy CGI redirects (non-.pl tool/data endpoints; 2026-06-19) ──
    # These are the cgi-bin URLs still returning 200 (served directly) in the
    # prod access log after phases 1-3. Map the tools to their SPA equivalents
    # and send everything else to home via the /cgi-bin/ catch-all below.

    # search/featureSearch → feature search
    location = /cgi-bin/search/featureSearch {
        absolute_redirect off;
        return 301 /feature-search;
    }

    # seqTools → sequence tools
    location = /cgi-bin/seqTools {
        absolute_redirect off;
        return 301 /seq-tools;
    }

    # PATMATCH/getSequence → pattern match tool
    location = /cgi-bin/PATMATCH/getSequence {
        absolute_redirect off;
        return 301 /patmatch;
    }

    # PATMATCH/RestrictionMapper → restriction mapper
    location = /cgi-bin/PATMATCH/RestrictionMapper {
        absolute_redirect off;
        return 301 /restriction-mapper;
    }

    # colleague/colleagueSearch → colleague directory
    location = /cgi-bin/colleague/colleagueSearch {
        absolute_redirect off;
        return 301 /colleague;
    }

    # search/quickSearch → text search
    location = /cgi-bin/search/quickSearch {
        absolute_redirect off;
        return 301 /search/text;
    }

    # compute/web-primer → web primer tool
    location = /cgi-bin/compute/web-primer {
        absolute_redirect off;
        return 301 /webprimer;
    }

    # GO/goTermFinder → GO Term Finder
    location = /cgi-bin/GO/goTermFinder {
        absolute_redirect off;
        return 301 /go-term-finder;
    }

    # GO/goTermMapper (a.k.a. GO Slim Mapper) → GO Slim Mapper
    location = /cgi-bin/GO/goTermMapper {
        absolute_redirect off;
        return 301 /go-slim-mapper;
    }

    # gbrowse2/* (legacy GBrowse) → JBrowse2
    location /cgi-bin/gbrowse2/ {
        absolute_redirect off;
        return 301 /jbrowse2/;
    }

    # protein/<accession> domain pages + get3d data endpoint → home.
    # The exact-match protein/*.pl blocks above (proteinPage, domainPage,
    # proteinProperty) take precedence over this prefix.
    location /cgi-bin/protein/ {
        absolute_redirect off;
        return 301 /;
    }

    # Catch-all: any other legacy /cgi-bin/ script → home. Plain prefix, so
    # all exact (=) and longer-prefix blocks above win; this only fires for
    # cgi-bin URLs not handled by a more specific rule.
    location /cgi-bin/ {
        absolute_redirect off;
        return 301 /;
    }

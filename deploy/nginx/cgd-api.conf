# Reverse proxy /api/* to the local CGD API service (127.0.0.1:8000)
# Place this in: /etc/nginx/conf.d/cgd-api.conf  (or included site file)

location /api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket / keepalive friendliness
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Increased timeouts for long-running operations (e.g., GO Term Finder with large gene lists)
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
}

# Serve source-visible SEO metadata for locus SPA pages.
# This must appear before the frontend SPA fallback `location /`.
location /locus/ {
    proxy_pass http://127.0.0.1:8000/locus/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
}
